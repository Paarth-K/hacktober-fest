[package]
name = "local-code-companion"
version = "0.1.0"
description = "Floating local-first progress and learning companion"
authors = ["Local Code Companion contributors"]
edition = "2021"

[lib]
name = "local_code_companion_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
open = "5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
shell-words = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-window-state = "2"

[dev-dependencies]
tempfile = "3"
